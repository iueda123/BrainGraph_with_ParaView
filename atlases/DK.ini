# Atlas definition for Build_Labeled_Surfaces.py
#
# surface_L / surface_R : whole-hemisphere cortical surface in vtk/without_val/ that is painted by label
# filler_L / filler_R   : (optional) mesh that closes the medial wall where the surface has no labels; smoothed and drawn opaque
# labels_table          : OBJECT_LABEL (the name used in value tables), HEMI (L or R), and the source of the label
# source_type           : how the labels reach the surface vertices
#     parcel-vtk    : labels_table lists one mesh per label (VTK_FILE under vtk/without_val/); each surface vertex
#                     takes the label of the nearest mesh vertex.
#     label-volume  : (not implemented) a NIfTI label volume in the same space as the surface is sampled at the
#                     vertices. This is the route for atlases that have no per-label meshes (e.g. HCP-MMP);
#                     labels_table then lists OBJECT_LABEL, HEMI and the integer value of the label in the volume.
[Atlas]
name = DK
source_type = parcel-vtk
surface_L = Lt_ribbon.vtk
surface_R = Rt_ribbon.vtk
labels_table = atlases/DK_labels.tsv
filler_L = Lt_Empty_CC.vtk
filler_R = Rt_Empty_CC.vtk
