[Settings]
#
# value_table_file
# (Please over write the templates)
# 
ValueName = 'The name of the values'
value_table_file='./tsv/Value-Table-You-Created.tsv'
Unit = 'any unit'
output_folder = './png/The-Folder-You-Want-to-Output-To'
value_range_ul_on_figure = 0.4
value_range_ll_on_figure = -0.4

#################################
# Settings for Color Bar #
################################
#LUT = 'Fast'
LUT = 'Cool to Warm'
#LUT = 'Black-Body Radiation'
#LUT = 'Inferno (matplotlib)'
#LUT = 'Blue Orange (divergent)'
#LUT = 'Cold and Hot'
#LUT = 'Rainbow Desaturated'
#LUT = 'Rainbow Uniform'
#LUT = 'Turbo'
#LUT = 'Cool to Warm (Extended)'
#LUT = 'X Ray'
#LUT = 'Black, Blue and White'
#LUT = 'Viridis (matplotlib)'
#LUT = 'Linear Green (Gr4L)'
#LUT = 'Blue - Green - Orange'
#LUT = 'Yellow - Gray - Blue'

################################
# 輝き: min:0.0, max: 1.0 #
################################
SPECULAR = 1.0 

################################
# Painted-surface mode (all keys below are optional) #
################################
# surface_mode: 'parcels' draws every label as its own mesh (the former behaviour; the default when absent).
#               'painted' paints one continuous cortical surface per hemisphere, so borders leave no gaps.
#               It needs vtk/labeled/<atlas>/, which the generate_*.sh scripts build when it is missing
#               (see Build_Labeled_Surfaces.py).
surface_mode = painted
# atlas: name of an atlas definition in ./atlases/<atlas>.ini
atlas = DK
# border_opacity: opacity of thin lines drawn where the label changes (0 = no lines). border_color: R, G, B in 0-1.
border_opacity = 0
#border_color = 0.25, 0.25, 0.25
# na_color: colour of cortical labels whose value is empty or NA in the value table (R, G, B in 0-1)
#na_color = 0.74, 0.74, 0.74
# representation: how the deep structures are drawn: 'Wireframe' (former behaviour) or 'Surface' (smoothed, lit)
representation = Surface
# image_scale: multiplies the saved image size (938 x 781 px at 1); the scene is re-rendered, not enlarged
#image_scale = 1
# surface_specular: specular of the painted surface and of 'Surface' deep structures (0-1)
#surface_specular = 0.12
# lut_invert: reverse the colour map. ParaView's single-hue presets (Reds, Blues, ...) run from dark (low) to light (high),
#             so use  LUT = 'Reds'  with  lut_invert = true  for values that grow from 0.
#lut_invert = false

# Parameters of Build_Labeled_Surfaces.py (defaults shown). Changing them changes the figures; the report in
# vtk/labeled/<atlas>/<atlas>_report.tsv records the values used, and expected/<atlas>_report.tsv is the reference.
